syntax = "proto3";

option java_package = "com.example.notepad.proto";
option java_multiple_files = true;

enum SortNotesMode {
  Default = 0;
  ByCreationTime = 1;
  ByContentSize = 2;
  ByNameLength = 3;
  ByLastEditTime = 4;
}

message NoteDisplaySettings {
  bool is_grid_enabled = 1;
  bool is_order_num_enabled = 2;
  bool is_zebra_note_colors_enabled = 3;
  SortNotesMode sort_mode = 4;
  bool is_sort_asc = 5;
}